<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Create Requisition | DSOG Fashion</title>
  
  <meta name="theme-color" content="#ec4899">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview(1).png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --pink: #ec4899;
      --pink-dark: #be185d;
      --text-primary: #1e293b;
      --text-muted: #64748b;
      --green: #10b981;
      --red: #ef4444;
      --orange: #f59e0b;
      --blue: #3b82f6;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(145deg, #fdf2f8 0%, #ffffff 100%);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      padding: 0.5rem 2%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(236, 72, 153, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }

    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-img { height: 34px; width: 34px; border-radius: 10px; object-fit: contain; background: white; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2); }
    .logo-text {
      font-weight: 800; font-size: 1.1rem;
      background: linear-gradient(145deg, #f472b6, #be185d);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-text span { font-weight: 600; font-size: 0.7rem; background: #ec4899; -webkit-text-fill-color: #ec4899; margin-left: 3px; }

    .nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-btn {
      background: rgba(236, 72, 153, 0.08);
      border: 1px solid rgba(236, 72, 153, 0.2);
      padding: 0.4rem 0.8rem;
      border-radius: 25px;
      color: var(--pink-dark);
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: var(--pink); color: white; }

    .container { padding: 1rem 2%; max-width: 1200px; margin: 0 auto; }

    .page-header { margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; }
    .page-header h1 { font-size: 1.3rem; font-weight: 800; color: #0f172a; }
    .page-header h1 i { color: var(--pink-dark); margin-right: 6px; }
    .page-header p { color: var(--text-muted); font-size: 0.75rem; }

    .form-card {
      background: white;
      border-radius: 16px;
      padding: 1.2rem;
      border: 1px solid #fbcfe8;
      box-shadow: 0 3px 12px rgba(190,24,93,0.03);
      max-width: 900px;
      margin: 0 auto;
    }
    .form-card h3 {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--pink-dark);
    }
    .form-card h3 i { color: var(--pink); font-size: 0.7rem; }

    .form-group { margin-bottom: 0.6rem; }
    .form-group label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 0.15rem;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      transition: all 0.15s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--pink);
      outline: none;
      background: white;
      box-shadow: 0 0 0 3px rgba(236,72,153,0.06);
    }

    .product-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 0.5rem;
      background: #fdf2f8;
      padding: 0.6rem;
      border-radius: 10px;
      border: 1px solid #fbcfe8;
      flex-wrap: wrap;
    }
    .product-row .form-group { margin-bottom: 0; flex: 1; min-width: 100px; }
    .product-row .btn-remove {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.7rem;
      flex-shrink: 0;
    }

    .btn-add-item {
      background: #fdf2f8;
      color: #be185d;
      border: 2px dashed #fbcfe8;
      padding: 0.4rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      width: 100%;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-add-item:hover { background: #fce7f3; }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      font-family: inherit;
      justify-content: center;
    }
    .btn-primary { background: var(--pink); color: white; }
    .btn-primary:hover { background: var(--pink-dark); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .btn-secondary:hover { background: #e2e8f0; }

    .btn-row { display: flex; gap: 10px; margin-top: 1rem; justify-content: flex-end; flex-wrap: wrap; }

    .toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--green);
      color: white;
      padding: 0.7rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      z-index: 4000;
      animation: slideIn 0.3s ease;
      box-shadow: 0 8px 20px rgba(16,185,129,0.25);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
    }
    .toast.error { background: var(--red); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .summary-box {
      background: linear-gradient(135deg, #fdf2f8, #fce7f3);
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      text-align: center;
      margin-top: 0.8rem;
      border: 1px solid #fbcfe8;
    }
    .summary-box .total-items {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--pink-dark);
    }
    .summary-box .breakdown {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    @media (max-width: 700px) {
      .product-row { flex-direction: column; align-items: stretch; }
      .container { padding: 0.8rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview(1).png" alt="DSOG Fashion" class="logo-img">
      <span class="logo-text">DSOG <span>Fashion</span></span>
    </a>
    <div class="nav-right">
      <a href="index.html" class="nav-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
      <a href="dsog-fashion-orders.html" class="nav-btn"><i class="fas fa-shopping-bag"></i> Orders</a>
      <a href="dsog-fashion-inventory.html" class="nav-btn"><i class="fas fa-boxes"></i> Inventory</a>
      <a href="dsog-fashion-products.html" class="nav-btn"><i class="fas fa-tags"></i> Products</a>
      <a href="dsog-fashion-franchisees.html" class="nav-btn"><i class="fas fa-store"></i> Franchises</a>
      <a href="dsog-fashion-requisitions.html" class="nav-btn" style="background:var(--pink);color:white;border-color:var(--pink-dark);"><i class="fas fa-file-invoice"></i> Requisitions</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-file-invoice"></i> New Requisition</h1>
        <p>Request products from another store — <strong>they will approve or reject</strong></p>
      </div>
    </div>

    <div class="form-card">
      <h3><i class="fas fa-route"></i> Requisition Details</h3>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;">
        <div class="form-group">
          <label>Requesting Store <i class="fas fa-arrow-right" style="color:var(--pink);"></i></label>
          <select id="fromLocation">
            <option value="">— Select Store —</option>
          </select>
        </div>

        <div class="form-group">
          <label>Fulfilling Store <i class="fas fa-arrow-right" style="color:var(--pink);"></i></label>
          <select id="toLocation">
            <option value="">— Select Store —</option>
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;">
        <div class="form-group">
          <label>Requisition Reference</label>
          <input type="text" id="requisitionRef" placeholder="e.g., Stock request - Westlands">
        </div>

        <div class="form-group">
          <label>Request Date</label>
          <input type="date" id="requisitionDate">
        </div>
      </div>

      <div class="form-group">
        <label>Reason / Notes</label>
        <textarea id="requisitionNotes" rows="2" placeholder="Why do you need these products?"></textarea>
      </div>

      <hr style="border: none; border-top: 1px solid #fbcfe8; margin: 0.8rem 0;">

      <h3 style="font-size:0.8rem; font-weight:700; color:var(--text-muted); margin-bottom:0.6rem;">
        <i class="fas fa-boxes"></i> Products Requested
      </h3>
      
      <div id="productRows">
        <div class="product-row" data-index="0">
          <div class="form-group" style="flex:2;">
            <label>Product</label>
            <select class="product-select">
              <option value="">— Select Product —</option>
            </select>
          </div>
          <div class="form-group" style="flex:0.8;">
            <label>Qty</label>
            <input type="number" class="product-qty" value="1" min="1">
          </div>
          <button class="btn-remove" onclick="removeRow(this)" title="Remove">✕</button>
        </div>
      </div>

      <button class="btn-add-item" onclick="addRow()"><i class="fas fa-plus"></i> Add Another Product</button>

      <div class="summary-box">
        <div class="total-items" id="requestTotal">0 products requested</div>
        <div class="breakdown" id="requestBreakdown">Add products to request</div>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-undo"></i> Reset</button>
        <button class="btn btn-primary" id="submitBtn" onclick="submitRequisition()">
          <i class="fas fa-paper-plane"></i> Submit Requisition
        </button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7kppUyHUaPzeLBV62NEZWuHiuz1Kz0mA",
      authDomain: "mugera-e51cc.firebaseapp.com",
      databaseURL: "https://mugera-e51cc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mugera-e51cc",
      storageBucket: "mugera-e51cc.firebasestorage.app",
      messagingSenderId: "1024868637509",
      appId: "1:1024868637509:web:321faecddce8f11d9cfc2c"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    let allProducts = {};
    let allFranchisees = {};
    let rowCount = 1;

    function showToast(msg, isError = false) {
      const container = document.getElementById('toastContainer');
      const existing = container.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : ''}`;
      toast.innerHTML = `<i class="fas fa-${isError ? 'exclamation-circle' : 'check-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    // Load franchisees
    database.ref('dsog_fashion_franchisees').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        allFranchisees = data;
      } else {
        allFranchisees = {};
      }
      populateLocationDropdowns();
    });

    // Load products
    database.ref('dsog_fashion_products').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        allProducts = data;
        Object.entries(allProducts).forEach(([id, p]) => { if (p) p.id = id; });
      } else {
        allProducts = {};
      }
      populateProductDropdowns();
    });

    function getLocationName(locationId) {
      if (locationId === 'main_shop') return 'Main Shop';
      return allFranchisees[locationId]?.businessName || locationId;
    }

    function populateLocationDropdowns() {
      const franchiseIds = Object.keys(allFranchisees);
      const allLocationIds = ['main_shop', ...franchiseIds];
      
      if (allLocationIds.length === 0) {
        ['fromLocation', 'toLocation'].forEach(id => {
          document.getElementById(id).innerHTML = '<option value="">— No locations found —</option>';
        });
        return;
      }

      const options = allLocationIds.map(id => {
        const isMain = id === 'main_shop';
        const name = isMain ? '🏪 Main Shop' : `📍 ${allFranchisees[id]?.businessName || id}`;
        return `<option value="${id}">${name}</option>`;
      }).join('');

      ['fromLocation', 'toLocation'].forEach(id => {
        const select = document.getElementById(id);
        if (select.options.length <= 1 || select.options[0].value === '') {
          select.innerHTML = options;
        }
      });

      // Set defaults
      const fromSelect = document.getElementById('fromLocation');
      const toSelect = document.getElementById('toLocation');
      if (fromSelect.value === '') fromSelect.value = 'main_shop';
      if (toSelect.value === '' && franchiseIds.length > 0) toSelect.value = franchiseIds[0];
    }

    function populateProductDropdowns() {
      const products = Object.values(allProducts)
        .filter(p => p && p.name)
        .sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      const options = products.map(p => {
        const stock = p.stock || p.quantity || 0;
        return `<option value="${p.id}">${p.name} (${p.sku || 'No SKU'}) — ${stock} in stock</option>`;
      }).join('');

      document.querySelectorAll('.product-select').forEach(select => {
        const currentVal = select.value;
        select.innerHTML = '<option value="">— Select Product —</option>' + options;
        if (currentVal) select.value = currentVal;
      });
    }

    function addRow() {
      rowCount++;
      const row = document.createElement('div');
      row.className = 'product-row';
      row.dataset.index = rowCount;
      row.innerHTML = `
        <div class="form-group" style="flex:2;">
          <label>Product</label>
          <select class="product-select">
            <option value="">— Select Product —</option>
          </select>
        </div>
        <div class="form-group" style="flex:0.8;">
          <label>Qty</label>
          <input type="number" class="product-qty" value="1" min="1">
        </div>
        <button class="btn-remove" onclick="removeRow(this)" title="Remove">✕</button>
      `;
      document.getElementById('productRows').appendChild(row);
      populateProductDropdowns();
      updateSummary();
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('.product-row');
      if (rows.length <= 1) { showToast('Need at least one product row', true); return; }
      btn.closest('.product-row').remove();
      updateSummary();
    }

    function updateSummary() {
      let totalQty = 0;
      let totalProducts = 0;
      let productNames = [];

      document.querySelectorAll('.product-row').forEach(row => {
        const select = row.querySelector('.product-select');
        const qtyInput = row.querySelector('.product-qty');
        if (select && select.value) {
          totalProducts++;
          const product = allProducts[select.value];
          const qty = parseInt(qtyInput?.value) || 0;
          totalQty += qty;
          productNames.push(`${product?.name || 'Unknown'} (${qty})`);
        }
      });

      document.getElementById('requestTotal').textContent = `${totalQty} item${totalQty !== 1 ? 's' : ''}`;
      document.getElementById('requestBreakdown').textContent = productNames.length > 0 ? productNames.join(', ') : 'Add products to request';
    }

    function getRequisitionData() {
      const fromLocation = document.getElementById('fromLocation').value;
      const toLocation = document.getElementById('toLocation').value;
      const ref = document.getElementById('requisitionRef').value.trim() || `REQ-${Date.now().toString().slice(-6)}`;
      const date = document.getElementById('requisitionDate').value || new Date().toISOString().split('T')[0];
      const notes = document.getElementById('requisitionNotes').value.trim();

      if (!fromLocation) { showToast('❌ Select requesting store', true); return null; }
      if (!toLocation) { showToast('❌ Select fulfilling store', true); return null; }
      if (fromLocation === toLocation) { showToast('❌ Requesting and fulfilling stores must be different!', true); return null; }

      const products = [];
      let hasError = false;

      document.querySelectorAll('.product-row').forEach(row => {
        const select = row.querySelector('.product-select');
        const qtyInput = row.querySelector('.product-qty');
        if (select && select.value) {
          const qty = parseInt(qtyInput?.value) || 0;
          if (qty <= 0) {
            showToast('❌ Quantity must be greater than 0', true);
            hasError = true;
            return;
          }
          const product = allProducts[select.value];
          products.push({
            productId: select.value,
            name: product?.name || 'Unknown',
            sku: product?.sku || '',
            quantity: qty
          });
        }
      });

      if (hasError) return null;
      if (products.length === 0) { showToast('❌ Add at least one product', true); return null; }

      return {
        from: fromLocation,
        fromName: getLocationName(fromLocation),
        to: toLocation,
        toName: getLocationName(toLocation),
        reference: ref,
        date: date,
        notes: notes,
        products: products,
        totalItems: products.reduce((sum, p) => sum + p.quantity, 0),
        status: 'pending', // pending | approved | rejected | completed
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        createdBy: auth.currentUser?.email || 'staff'
      };
    }

    async function submitRequisition() {
      const data = getRequisitionData();
      if (!data) return;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

      try {
        await database.ref('dsog_fashion_requisitions').push().set(data);
        showToast(`✅ Requisition submitted to ${data.toName}!`);
        resetForm();
      } catch (e) {
        console.error(e);
        showToast('❌ Failed to submit: ' + e.message, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Requisition';
      }
    }

    function resetForm() {
      document.getElementById('requisitionRef').value = '';
      document.getElementById('requisitionDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('requisitionNotes').value = '';
      
      document.getElementById('productRows').innerHTML = `
        <div class="product-row" data-index="0">
          <div class="form-group" style="flex:2;">
            <label>Product</label>
            <select class="product-select">
              <option value="">— Select Product —</option>
            </select>
          </div>
          <div class="form-group" style="flex:0.8;">
            <label>Qty</label>
            <input type="number" class="product-qty" value="1" min="1">
          </div>
          <button class="btn-remove" onclick="removeRow(this)" title="Remove">✕</button>
        </div>
      `;
      rowCount = 1;
      populateProductDropdowns();
      updateSummary();
    }

    // Set default date
    document.getElementById('requisitionDate').value = new Date().toISOString().split('T')[0];

    // Listen for changes to update summary
    document.addEventListener('change', (e) => {
      if (e.target.classList.contains('product-select') || e.target.classList.contains('product-qty')) {
        updateSummary();
      }
    });

    auth.onAuthStateChanged((user) => {
      if (!user) window.location.href = '/';
    });

    // Expose functions
    window.addRow = addRow;
    window.removeRow = removeRow;
    window.submitRequisition = submitRequisition;
    window.resetForm = resetForm;
    window.updateSummary = updateSummary;

    updateSummary();
  </script>
</body>
</html>
