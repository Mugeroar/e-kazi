<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stock Transfer | DSOG Fashion</title>
  
  <meta name="theme-color" content="#ec4899">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="icon" type="image/png" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview(1).png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --pink: #ec4899;
      --pink-dark: #be185d;
      --text-primary: #1e293b;
      --text-muted: #64748b;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --orange: #f59e0b;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(145deg, #fdf2f8 0%, #ffffff 100%);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      padding: 0.5rem 2%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(236, 72, 153, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }

    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-img { height: 34px; width: 34px; border-radius: 10px; object-fit: contain; background: white; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2); }
    .logo-text {
      font-weight: 800; font-size: 1.1rem;
      background: linear-gradient(145deg, #f472b6, #be185d);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-text span { font-weight: 600; font-size: 0.7rem; background: #ec4899; -webkit-text-fill-color: #ec4899; margin-left: 3px; }

    .nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-btn {
      background: rgba(236, 72, 153, 0.08);
      border: 1px solid rgba(236, 72, 153, 0.2);
      padding: 0.4rem 0.8rem;
      border-radius: 25px;
      color: var(--pink-dark);
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: var(--pink); color: white; }
    .nav-btn.active { background: var(--pink); color: white; }

    .container { padding: 1rem 2%; max-width: 1200px; margin: 0 auto; }

    .page-header { margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; }
    .page-header h1 { font-size: 1.3rem; font-weight: 800; color: #0f172a; }
    .page-header h1 i { color: var(--pink-dark); margin-right: 6px; }
    .page-header p { color: var(--text-muted); font-size: 0.75rem; }

    .form-card {
      background: white;
      border-radius: 16px;
      padding: 1.2rem;
      border: 1px solid #fbcfe8;
      box-shadow: 0 3px 12px rgba(190,24,93,0.03);
      max-width: 800px;
      margin: 0 auto;
    }
    .form-card h3 {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--pink-dark);
    }
    .form-card h3 i { color: var(--pink); font-size: 0.7rem; }

    .form-group { margin-bottom: 0.6rem; }
    .form-group label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 0.15rem;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      transition: all 0.15s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--pink);
      outline: none;
      background: white;
      box-shadow: 0 0 0 3px rgba(236,72,153,0.06);
    }

    .product-transfer-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 0.5rem;
      background: #fdf2f8;
      padding: 0.6rem;
      border-radius: 10px;
      border: 1px solid #fbcfe8;
      transition: all 0.2s;
      flex-wrap: wrap;
    }
    .product-transfer-row.confirmed {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .product-transfer-row .form-group { margin-bottom: 0; flex: 1; min-width: 120px; }
    .product-transfer-row .btn-remove {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.7rem;
      flex-shrink: 0;
    }

    .btn-add-item {
      background: #fdf2f8;
      color: #be185d;
      border: 2px dashed #fbcfe8;
      padding: 0.4rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      width: 100%;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-add-item:hover { background: #fce7f3; }

    .confirm-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      padding: 0.3rem 0.6rem;
      background: white;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .confirm-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
      cursor: pointer;
    }
    .confirm-checkbox.confirmed {
      background: #d1fae5;
      border-color: #6ee7b7;
      color: #065f46;
    }
    .confirm-checkbox.confirmed input[type="checkbox"] {
      accent-color: var(--green);
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      font-family: inherit;
      justify-content: center;
    }
    .btn-primary { background: var(--pink); color: white; }
    .btn-primary:hover { background: var(--pink-dark); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-success { background: var(--green); color: white; }
    .btn-success:hover { background: #059669; }

    .btn-row { display: flex; gap: 10px; margin-top: 1rem; justify-content: flex-end; flex-wrap: wrap; }

    .transfer-summary {
      background: linear-gradient(135deg, #fdf2f8, #fce7f3);
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      text-align: center;
      margin-top: 0.8rem;
      border: 1px solid #fbcfe8;
    }
    .transfer-summary .total-items {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--pink-dark);
    }
    .transfer-summary .breakdown {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }
    .transfer-summary .status-message {
      font-size: 0.65rem;
      margin-top: 0.3rem;
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
      display: inline-block;
    }
    .transfer-summary .status-message.ready {
      background: #d1fae5;
      color: #065f46;
    }
    .transfer-summary .status-message.waiting {
      background: #fef3c7;
      color: #92400e;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--green);
      color: white;
      padding: 0.7rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      z-index: 4000;
      animation: slideIn 0.3s ease;
      box-shadow: 0 8px 20px rgba(16,185,129,0.25);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
    }
    .toast.error { background: var(--red); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .product-label {
      font-weight: 600;
      font-size: 0.75rem;
      color: var(--text-primary);
      padding: 0.2rem 0.4rem;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    @media (max-width: 700px) {
      .product-transfer-row { flex-direction: column; align-items: stretch; }
      .row-actions { justify-content: flex-end; }
      .container { padding: 0.8rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview(1).png" alt="DSOG Fashion" class="logo-img">
      <span class="logo-text">DSOG <span>Fashion</span></span>
    </a>
    <div class="nav-right">
      <a href="index.html" class="nav-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
      <a href="dsog-fashion-orders.html" class="nav-btn"><i class="fas fa-shopping-bag"></i> Orders</a>
      <a href="dsog-fashion-inventory.html" class="nav-btn"><i class="fas fa-boxes"></i> Inventory</a>
      <a href="dsog-fashion-products.html" class="nav-btn"><i class="fas fa-tags"></i> Products</a>
      <a href="dsog-fashion-franchisees.html" class="nav-btn"><i class="fas fa-store"></i> Franchises</a>
      <a href="dsog-fashion-transfer-logs.html" class="nav-btn"><i class="fas fa-history"></i> Transfer Logs</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-arrows-alt-h"></i> New Stock Transfer</h1>
        <p>Transfer products between stores — <strong>confirm stock availability</strong> to complete transfer</p>
      </div>
    </div>

    <div class="form-card">
      <h3><i class="fas fa-route"></i> Transfer Details</h3>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;">
        <div class="form-group">
          <label>From Store <i class="fas fa-arrow-right" style="color:var(--pink);"></i></label>
          <select id="fromLocation">
            <option value="">— Select Store —</option>
          </select>
        </div>

        <div class="form-group">
          <label>To Store <i class="fas fa-arrow-right" style="color:var(--pink);"></i></label>
          <select id="toLocation">
            <option value="">— Select Store —</option>
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;">
        <div class="form-group">
          <label>Transfer Reference</label>
          <input type="text" id="transferRef" placeholder="e.g., Weekly restock - Westlands">
        </div>

        <div class="form-group">
          <label>Transfer Date</label>
          <input type="date" id="transferDate">
        </div>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea id="transferNotes" rows="2" placeholder="Reason for transfer, special instructions..."></textarea>
      </div>

      <hr style="border: none; border-top: 1px solid #fbcfe8; margin: 0.8rem 0;">

      <h3 style="font-size:0.8rem; font-weight:700; color:var(--text-muted); margin-bottom:0.6rem;">
        <i class="fas fa-boxes"></i> Products to Transfer
      </h3>
      
      <div id="transferRows">
        <div class="product-transfer-row" data-index="0">
          <div class="form-group" style="flex:2;">
            <label>Product</label>
            <select class="product-select" onchange="onProductSelect(this)">
              <option value="">— Select Product —</option>
            </select>
          </div>
          <div class="row-actions">
            <label class="confirm-checkbox" id="confirmLabel0">
              <input type="checkbox" class="confirm-check" onchange="onConfirmChange(this)">
              <span>Has Stock</span>
            </label>
            <button class="btn-remove" onclick="removeRow(this)" title="Remove">✕</button>
          </div>
        </div>
      </div>

      <button class="btn-add-item" onclick="addRow()"><i class="fas fa-plus"></i> Add Another Product</button>

      <div class="transfer-summary" id="transferSummary">
        <div class="total-items" id="transferTotal">0 products selected</div>
        <div class="breakdown" id="transferBreakdown">Add products to transfer</div>
        <div>
          <span class="status-message waiting" id="statusMessage">⚠️ Confirm stock for each product</span>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-undo"></i> Reset</button>
        <button class="btn btn-primary" id="confirmBtn" onclick="confirmTransfer()" disabled>
          <i class="fas fa-check-circle"></i> Complete Transfer
        </button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7kppUyHUaPzeLBV62NEZWuHiuz1Kz0mA",
      authDomain: "mugera-e51cc.firebaseapp.com",
      databaseURL: "https://mugera-e51cc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mugera-e51cc",
      storageBucket: "mugera-e51cc.firebasestorage.app",
      messagingSenderId: "1024868637509",
      appId: "1:1024868637509:web:321faecddce8f11d9cfc2c"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    let allProducts = {};
    let allFranchisees = {};
    let rowCount = 1;

    function showToast(msg, isError = false) {
      const container = document.getElementById('toastContainer');
      const existing = container.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : ''}`;
      toast.innerHTML = `<i class="fas fa-${isError ? 'exclamation-circle' : 'check-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    // Load franchisees
    database.ref('dsog_fashion_franchisees').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        allFranchisees = data;
      } else {
        allFranchisees = {};
      }
      populateLocationDropdowns();
    });

    // Load products
    database.ref('dsog_fashion_products').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        allProducts = data;
        Object.entries(allProducts).forEach(([id, p]) => { if (p) p.id = id; });
      } else {
        allProducts = {};
      }
      populateProductDropdowns();
    });

    function getLocationName(locationId) {
      if (locationId === 'main_shop') return 'Main Shop';
      return allFranchisees[locationId]?.businessName || locationId;
    }

    function populateLocationDropdowns() {
      const franchiseIds = Object.keys(allFranchisees);
      const allLocationIds = ['main_shop', ...franchiseIds];
      
      if (allLocationIds.length === 0) {
        document.getElementById('fromLocation').innerHTML = '<option value="">— No locations found —</option>';
        document.getElementById('toLocation').innerHTML = '<option value="">— No locations found —</option>';
        return;
      }

      const options = allLocationIds.map(id => {
        const isMain = id === 'main_shop';
        const name = isMain ? '🏪 Main Shop' : `📍 ${allFranchisees[id]?.businessName || id}`;
        return `<option value="${id}">${name}</option>`;
      }).join('');

      ['fromLocation', 'toLocation'].forEach(id => {
        const select = document.getElementById(id);
        if (select.options.length <= 1 || select.options[0].value === '') {
          select.innerHTML = options;
        }
      });

      // Set default: From = Main Shop, To = first franchise
      const fromSelect = document.getElementById('fromLocation');
      const toSelect = document.getElementById('toLocation');
      if (fromSelect.value === '') fromSelect.value = 'main_shop';
      if (toSelect.value === '' && franchiseIds.length > 0) toSelect.value = franchiseIds[0];
    }

    function populateProductDropdowns() {
      const products = Object.values(allProducts)
        .filter(p => p && p.name)
        .sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      const options = products.map(p => {
        const stock = p.stock || p.quantity || 0;
        return `<option value="${p.id}" data-stock="${stock}">${p.name} (${p.sku || 'No SKU'}) — ${stock} in stock</option>`;
      }).join('');

      document.querySelectorAll('.product-select').forEach(select => {
        const currentVal = select.value;
        select.innerHTML = '<option value="">— Select Product —</option>' + options;
        if (currentVal) select.value = currentVal;
      });
    }

    function addRow() {
      rowCount++;
      const row = document.createElement('div');
      row.className = 'product-transfer-row';
      row.dataset.index = rowCount;
      row.innerHTML = `
        <div class="form-group" style="flex:2;">
          <label>Product</label>
          <select class="product-select" onchange="onProductSelect(this)">
            <option value="">— Select Product —</option>
          </select>
        </div>
        <div class="row-actions">
          <label class="confirm-checkbox" id="confirmLabel${rowCount}">
            <input type="checkbox" class="confirm-check" onchange="onConfirmChange(this)">
            <span>Has Stock</span>
          </label>
          <button class="btn-remove" onclick="removeRow(this)" title="Remove">✕</button>
        </div>
      `;
      document.getElementById('transferRows').appendChild(row);
      populateProductDropdowns();
      updateSummary();
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('.product-transfer-row');
      if (rows.length <= 1) { showToast('Need at least one product row', true); return; }
      btn.closest('.product-transfer-row').remove();
      updateSummary();
    }

    function onProductSelect(select) {
      updateSummary();
    }

    function onConfirmChange(checkbox) {
      const row = checkbox.closest('.product-transfer-row');
      const label = row.querySelector('.confirm-checkbox');
      if (checkbox.checked) {
        label.classList.add('confirmed');
        row.classList.add('confirmed');
      } else {
        label.classList.remove('confirmed');
        row.classList.remove('confirmed');
      }
      updateSummary();
    }

    function updateSummary() {
      let totalProducts = 0;
      let confirmedCount = 0;
      let productNames = [];

      document.querySelectorAll('.product-transfer-row').forEach(row => {
        const select = row.querySelector('.product-select');
        const checkbox = row.querySelector('.confirm-check');
        if (select && select.value) {
          totalProducts++;
          const product = allProducts[select.value];
          productNames.push(product?.name || 'Unknown');
          if (checkbox && checkbox.checked) {
            confirmedCount++;
          }
        }
      });

      document.getElementById('transferTotal').textContent = `${totalProducts} product${totalProducts !== 1 ? 's' : ''} selected`;
      document.getElementById('transferBreakdown').textContent = productNames.length > 0 ? productNames.join(', ') : 'Add products to transfer';

      const statusMsg = document.getElementById('statusMessage');
      const confirmBtn = document.getElementById('confirmBtn');

      if (totalProducts === 0) {
        statusMsg.textContent = '⚠️ Add at least one product';
        statusMsg.className = 'status-message waiting';
        confirmBtn.disabled = true;
      } else if (confirmedCount === totalProducts && totalProducts > 0) {
        statusMsg.textContent = '✅ All products confirmed! Ready to transfer';
        statusMsg.className = 'status-message ready';
        confirmBtn.disabled = false;
      } else {
        statusMsg.textContent = `⚠️ Confirm stock for ${totalProducts - confirmedCount} more product${totalProducts - confirmedCount !== 1 ? 's' : ''}`;
        statusMsg.className = 'status-message waiting';
        confirmBtn.disabled = true;
      }
    }

    function getTransferData() {
      const fromLocation = document.getElementById('fromLocation').value;
      const toLocation = document.getElementById('toLocation').value;
      const transferRef = document.getElementById('transferRef').value.trim() || `Transfer ${new Date().toLocaleDateString()}`;
      const transferDate = document.getElementById('transferDate').value || new Date().toISOString().split('T')[0];
      const notes = document.getElementById('transferNotes').value.trim();

      if (!fromLocation) { showToast('❌ Select a "From" store', true); return null; }
      if (!toLocation) { showToast('❌ Select a "To" store', true); return null; }
      if (fromLocation === toLocation) { showToast('❌ From and To stores must be different!', true); return null; }

      const products = [];
      let allConfirmed = true;

      document.querySelectorAll('.product-transfer-row').forEach(row => {
        const select = row.querySelector('.product-select');
        const checkbox = row.querySelector('.confirm-check');
        if (select && select.value) {
          const product = allProducts[select.value];
          const isConfirmed = checkbox && checkbox.checked;
          if (!isConfirmed) allConfirmed = false;
          products.push({
            productId: select.value,
            name: product?.name || 'Unknown',
            sku: product?.sku || '',
            price: product?.price || 0,
            confirmed: isConfirmed
          });
        }
      });

      if (products.length === 0) { showToast('❌ Add at least one product', true); return null; }
      if (!allConfirmed) { showToast('❌ Confirm stock for all products before transferring', true); return null; }

      return {
        from: fromLocation,
        fromName: getLocationName(fromLocation),
        to: toLocation,
        toName: getLocationName(toLocation),
        reference: transferRef,
        date: transferDate,
        notes: notes,
        products: products,
        totalItems: products.length,
        status: 'completed',
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        processedBy: auth.currentUser?.email || 'staff'
      };
    }

    async function confirmTransfer() {
      const transferData = getTransferData();
      if (!transferData) return;

      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      try {
        // Save the transfer log
        await database.ref('dsog_fashion_transfers').push().set(transferData);
        
        showToast(`✅ Transfer complete! ${transferData.totalItems} items moved from ${transferData.fromName} to ${transferData.toName}`);
        resetForm();
      } catch (e) {
        console.error(e);
        showToast('❌ Failed to complete transfer: ' + e.message, true);
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = '<i class="fas fa-check-circle"></i> Complete Transfer';
      }
    }

    function resetForm() {
      document.getElementById('transferRef').value = '';
      document.getElementById('transferDate').value = '';
      document.getElementById('transferNotes').value = '';
      
      // Reset product rows
      document.getElementById('transferRows').innerHTML = `
        <div class="product-transfer-row" data-index="0">
          <div class="form-group" style="flex:2;">
            <label>Product</label>
            <select class="product-select" onchange="onProductSelect(this)">
              <option value="">— Select Product —</option>
            </select>
          </div>
          <div class="row-actions">
            <label class="confirm-checkbox" id="confirmLabel0">
              <input type="checkbox" class="confirm-check" onchange="onConfirmChange(this)">
              <span>Has Stock</span>
            </label>
            <button class="btn-remove" onclick="removeRow(this)" title="Remove">✕</button>
          </div>
        </div>
      `;
      rowCount = 1;
      populateProductDropdowns();
      updateSummary();
      
      // Reset location dropdowns
      const franchiseIds = Object.keys(allFranchisees);
      document.getElementById('fromLocation').value = 'main_shop';
      if (franchiseIds.length > 0) document.getElementById('toLocation').value = franchiseIds[0];
    }

    // Set default date
    document.getElementById('transferDate').value = new Date().toISOString().split('T')[0];

    auth.onAuthStateChanged((user) => {
      if (!user) window.location.href = '/';
    });

    // Expose functions
    window.addRow = addRow;
    window.removeRow = removeRow;
    window.onProductSelect = onProductSelect;
    window.onConfirmChange = onConfirmChange;
    window.confirmTransfer = confirmTransfer;
    window.resetForm = resetForm;
    window.updateSummary = updateSummary;

    updateSummary();
  </script>
</body>
</html>
