<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

}
body { font-family: 'Inter', sans-serif; background: linear-gradient(145deg, #fdf2f8 0%, #ffffff 100%); color: var(--text-primary); line-height: 1.4; min-height: 100vh; display: flex; flex-direction: column; }

.navbar { background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); padding: 0.5rem 2%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(236,72,153,0.2); position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-img { height: 34px; width: 34px; border-radius: 10px; object-fit: contain; background: white; box-shadow: 0 4px 12px rgba(236,72,153,0.2); }
.logo-text { font-weight: 800; font-size: 1.1rem; background: linear-gradient(145deg, #f472b6, #be185d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo-text span { font-weight: 600; font-size: 0.7rem; background: #ec4899; -webkit-text-fill-color: #ec4899; margin-left: 3px; }
.nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nav-btn { background: rgba(236,72,153,0.08); border: 1px solid rgba(236,72,153,0.2); padding: 0.4rem 0.8rem; border-radius: 25px; color: var(--pink-dark); font-weight: 600; font-size: 0.7rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; transition: all 0.2s; }
.nav-btn:hover { background: var(--pink); color: white; }
.container { padding: 1rem 2%; flex: 1; }
.page-header { margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; }
.page-header h1 { font-size: 1.3rem; font-weight: 800; }
.page-header h1 i { color: var(--pink-dark); margin-right: 6px; }

.stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 1rem; }
.stat-mini { background: white; border-radius: 14px; padding: 0.8rem 1rem; text-align: center; border: 1px solid #fbcfe8; }
.stat-mini .stat-num { font-size: 1.4rem; font-weight: 800; color: var(--pink-dark); line-height: 1.1; }
.stat-mini .stat-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }

.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.filter-btn { padding: 0.35rem 0.8rem; border-radius: 20px; border: 1.5px solid #e2e8f0; background: white; color: #64748b; font-weight: 600; font-size: 0.65rem; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.filter-btn:hover { border-color: var(--pink); color: var(--pink-dark); }
.filter-btn.active { background: var(--pink); color: white; border-color: var(--pink); }
.filter-btn .count { background: rgba(255,255,255,0.25); padding: 0.1rem 0.4rem; border-radius: 10px; font-size: 0.55rem; margin-left: 4px; }
.search-box { flex: 1; min-width: 150px; max-width: 300px; position: relative; }
.search-box input { width: 100%; padding: 0.35rem 0.8rem 0.35rem 2rem; border-radius: 20px; border: 1.5px solid #e2e8f0; font-size: 0.7rem; font-family: inherit; }
.search-box i { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.7rem; }

.bulk-bar { display: none; align-items: center; gap: 10px; flex-wrap: wrap; background: linear-gradient(135deg, #1e293b, #334155); color: white; padding: 0.7rem 1rem; border-radius: 12px; margin-bottom: 0.8rem; }
.bulk-bar.active { display: flex; }
.bulk-bar .bulk-info { font-size: 0.75rem; font-weight: 700; }
.bulk-bar .bulk-actions { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.bulk-bar .bulk-btn { padding: 0.35rem 0.75rem; border-radius: 20px; border: none; font-size: 0.65rem; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 4px; }
.bulk-btn.confirm { background: #10b981; color: white; }
.bulk-btn.process { background: #3b82f6; color: white; }
.bulk-btn.ready { background: #f59e0b; color: white; }
.bulk-btn.cancel { background: #ef4444; color: white; }

.table-wrap { background: white; border-radius: 16px; border: 1px solid #fbcfe8; overflow: hidden; }
.table-scroll { overflow-x: auto; max-height: 65vh; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }

th.check-col, td.check-col { width: 34px; text-align: center; padding-left: 0.4rem; padding-right: 0.4rem; }

.status-processing { background: #e0f2fe; color: #0369a1; }

.action-btns { display: flex; gap: 4px; flex-wrap: wrap; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center; backdrop-filter: blur(2px); padding: 1rem; }

.modal { background: white; border-radius: 20px; padding: 1.5rem; max-width: 600px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }

.detail-item { background: #fdf2f8; padding: 0.6rem; border-radius: 10px; }
.detail-item strong { display: block; font-size: 0.6rem; color: var(--pink-dark); text-transform: uppercase; margin-bottom: 0.1rem; }
.detail-item.full { grid-column: 1 / -1; }
.btn-row { display: flex; gap: 8px; margin-top: 1rem; }
.btn { padding: 0.6rem 1.2rem; border-radius: 10px; border: none; font-weight: 700; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-family: inherit; }
.btn-secondary { background: #f1f5f9; color: #475569; }
.btn-primary { background: var(--pink); color: white; }
.btn-primary:hover { background: var(--pink-dark); }

.form-group { margin-bottom: 0.85rem; }
.form-group label { display: block; font-size: 0.68rem; font-weight: 700; color: var(--pink-dark); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 0.3rem; }
.form-group label .req { color: var(--red); }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.55rem 0.8rem; border-radius: 10px; border: 1.5px solid #e2e8f0; font-size: 0.78rem; font-family: inherit; background: #fdf2f8; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--pink); background: white; box-shadow: 0 0 0 3px rgba(236,72,153,0.1); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }

.status-flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.65rem; margin-bottom: 1rem; padding: 0.6rem; background: #fdf2f8; border-radius: 10px; }
.status-flow .step { padding: 0.2rem 0.5rem; border-radius: 10px; background: white; color: #94a3b8; font-weight: 700; border: 1px solid #e2e8f0; }
.status-flow .step.done { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
.status-flow .step.current { background: var(--pink); color: white; border-color: var(--pink); }
.status-flow i { color: #cbd5e1; font-size: 0.55rem; }

.toast { position: fixed; bottom: 25px; right: 25px; background: var(--green); color: white; padding: 0.7rem 1.2rem; border-radius: 20px; font-weight: 600; z-index: 4000; animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 6px; font-size: 0.75rem; max-width: 90%; }
.toast.error { background: var(--red); }
.toast.info { background: var(--blue); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 900px) { .stats-row { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 768px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7kppUyHUaPzeLBV62NEZWuHiuz1Kz0mA",
  authDomain: "mugera-e51cc.firebaseapp.com",
  databaseURL: "https://mugera-e51cc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mugera-e51cc"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const auth = firebase.auth();

let allOrders = {};
let allProducts = {};
let allInventory = {};
let currentFilter = 'all';
let searchQuery = '';
let selectedIds = new Set();
let currentUser = null;

const STATUS_FLOW = ['new', 'confirmed', 'processing', 'ready', 'shipped', 'delivered'];
const STATUS_LABELS = { new:'New', confirmed:'Confirmed', processing:'Processing', ready:'Ready', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled' };
const NEXT_ACTION = {
  new:        { status: 'confirmed',  label: 'Confirm', icon: 'check',         cls: 'btn-confirm' },
  confirmed:  { status: 'processing', label: 'Process', icon: 'spinner',       cls: 'btn-process' },
  processing: { status: 'ready',      label: 'Ready',   icon: 'box',           cls: 'btn-ready' },
  ready:      { status: 'shipped',    label: 'Ship',    icon: 'truck',         cls: 'btn-ship' },
  shipped:    { status: 'delivered',  label: 'Deliver', icon: 'check-double',  cls: 'btn-deliver' }
};

/* ═══ HELPERS ═══ */
function showToast(msg, type) {
  const c = document.getElementById('toastContainer');
  const existing = c.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');
  const icon = type === 'error' ? 'exclamation-circle' : type === 'info' ? 'info-circle' : 'check-circle';
  t.innerHTML = `<i class="fas fa-${icon}"></i> ${msg}`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function getInitials(name) {
  if (!name) return '??';
  return String(name).split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
}
function getStatusClass(s) {
  const m = { new:'status-new', confirmed:'status-confirmed', processing:'status-processing', ready:'status-ready', shipped:'status-shipped', delivered:'status-delivered', cancelled:'status-cancelled' };
  return m[s] || 'status-new';
}
function fmtTime(ts) {
  if (!ts) return '—';
  return new Date(Number(ts)).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

/* ═══ STOCK HELPERS (inline) ═══ */
function buildSkuMap() {
  const map = {};
  for (const [key, inv] of Object.entries(allInventory)) {
    if (inv.sku) map[inv.sku] = key;
  }
  return map;
}
function findInventoryKey(productId, product) {
  const skuMap = buildSkuMap();
  if (product && product.sku && skuMap[product.sku]) return skuMap[product.sku];
  if (allInventory[productId]) return productId;
  return null;
}

/* Build decrement updates for order placement */
function buildStockDecrementUpdates(products) {
  const updates = {};
  const errors = [];
  for (const item of products) {
    const productId = item.productId;
    const qty = Number(item.quantity || 0);
    if (!productId || qty <= 0) continue;

    const product = allProducts[productId];
    if (!product) {
      errors.push(`${item.name}: product not found`);
      continue;
    }
    const invKey = findInventoryKey(productId, product);
    const currentInvQty = invKey && allInventory[invKey] ? Number(allInventory[invKey].quantity || 0) : null;
    const currentProdStock = Number(product.stock || 0);
    const effective = currentInvQty !== null ? Math.min(currentInvQty, currentProdStock) : currentProdStock;

    if (effective < qty) {
      errors.push(`${item.name} (${item.size || 'FS'}): only ${effective} in stock, need ${qty}`);
      continue;
    }
    if (invKey) {
      updates['dsog_fashion_inventory/' + invKey + '/quantity'] = currentInvQty - qty;
      updates['dsog_fashion_inventory/' + invKey + '/updatedAt'] = firebase.database.ServerValue.TIMESTAMP;
    }
    updates['dsog_fashion_products/' + productId + '/stock'] = Math.max(0, currentProdStock - qty);
    updates['dsog_fashion_products/' + productId + '/updatedAt'] = firebase.database.ServerValue.TIMESTAMP;
  }
  return errors.length ? { ok: false, errors } : { ok: true, updates };
}

function buildRestockUpdates(products) {
  const updates = {};
  for (const item of products) {
    const productId = item.productId;
    const qty = Number(item.quantity || 0);
    if (!productId || qty <= 0) continue;
    const product = allProducts[productId];
    const invKey = product ? findInventoryKey(productId, product) : null;

    if (invKey && allInventory[invKey]) {
      updates['dsog_fashion_inventory/' + invKey + '/quantity'] = Number(allInventory[invKey].quantity || 0) + qty;
      updates['dsog_fashion_inventory/' + invKey + '/updatedAt'] = firebase.database.ServerValue.TIMESTAMP;
    }
    if (product) {
      updates['dsog_fashion_products/' + productId + '/stock'] = Number(product.stock || 0) + qty;
      updates['dsog_fashion_products/' + productId + '/updatedAt'] = firebase.database.ServerValue.TIMESTAMP;
    }
  }
  return updates;
}

/* ═══ STATS ═══ */
function updateStats() {
  const orders = Object.values(allOrders);
  const counts = { all: orders.length, new: 0, confirmed: 0, processing: 0, ready: 0, shipped: 0, delivered: 0, cancelled: 0 };
  orders.forEach(o => { const s = o.status || 'new'; if (counts[s] !== undefined) counts[s]++; });

  document.getElementById('statNew').textContent = counts.new;
  document.getElementById('statConfirmed').textContent = counts.confirmed;
  document.getElementById('statProcessing').textContent = counts.processing;
  document.getElementById('statReady').textContent = counts.ready;
  document.getElementById('statShipped').textContent = counts.shipped;

  document.getElementById('countAll').textContent = counts.all;
  document.getElementById('countNew').textContent = counts.new;
  document.getElementById('countConfirmed').textContent = counts.confirmed;
  document.getElementById('countProcessing').textContent = counts.processing;
  document.getElementById('countReady').textContent = counts.ready;
  document.getElementById('countShipped').textContent = counts.shipped;
  document.getElementById('countDelivered').textContent = counts.delivered;
  document.getElementById('countCancelled').textContent = counts.cancelled;

  document.getElementById('orderCount').textContent =
    counts.all + ' total · ' + counts.new + ' new · ' + counts.processing + ' processing · ' + counts.ready + ' ready';
}

/* ═══ RENDER ═══ */
function renderTable() {
  let orders = Object.entries(allOrders).map(([id, data]) => ({ id, ...data })).filter(o => o);

  if (currentFilter !== 'all') orders = orders.filter(o => (o.status || 'new') === currentFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    orders = orders.filter(o =>
      (o.customerName || '').toLowerCase().includes(q) ||
      (o.customerPhone || '').toLowerCase().includes(q) ||
      (o.franchiseName || '').toLowerCase().includes(q) ||
      (o.products || []).some(p => (p.name || '').toLowerCase().includes(q))
    );
  }
  orders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  if (!orders.length) {
    document.getElementById('tableBody').innerHTML = '<tr class="empty-row"><td colspan="9"><i class="fas fa-shopping-bag" style="font-size:2rem;display:block;margin-bottom:8px;"></i>No orders found</td></tr>';
    updateBulkBar();
    return;
  }

  document.getElementById('tableBody').innerHTML = orders.map(order => {
    const status = order.status || 'new';
    const products = order.products || [];
    const names = products.map(p => p.name).join(', ');
    const qty = products.reduce((s, p) => s + (p.quantity || 0), 0);
    const shortId = String(order.id).slice(-6);
    const checked = selectedIds.has(order.id) ? 'checked' : '';
    const rowCls = selectedIds.has(order.id) ? 'row-selected' : '';

    let actions = `<button class="action-btn btn-view" data-action="view" data-id="${order.id}" title="View"><i class="fas fa-eye"></i></button>`;
    if (NEXT_ACTION[status]) {
      const next = NEXT_ACTION[status];
      actions += `<button class="action-btn btn-next" data-action="advance" data-id="${order.id}" title="${next.label}"><i class="fas fa-${next.icon}"></i> ${next.label}</button>`;
    }
    if (status !== 'cancelled' && status !== 'shipped' && status !== 'delivered') {
      actions += `<button class="action-btn btn-cancel" data-action="cancel" data-id="${order.id}" title="Cancel"><i class="fas fa-times"></i></button>`;
    }

    return `
      <tr class="${rowCls}">
        <td class="check-col"><input type="checkbox" class="row-check" data-id="${order.id}" ${checked} onchange="toggleRow(this)"></td>
        <td><code style="font-size:0.65rem;background:#fdf2f8;padding:2px 6px;border-radius:4px;">#${shortId}</code></td>
        <td>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:28px;height:28px;background:#fdf2f8;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.65rem;color:#be185d;">${getInitials(order.customerName)}</div>
            <div>
              <strong>${esc(order.customerName || 'Customer')}</strong>
              <div style="font-size:0.6rem;color:#94a3b8;">${esc(order.customerPhone || '')}</div>
            </div>
          </div>
        </td>
        <td><span style="font-size:0.7rem;" title="${esc(names)}">${esc(names.substring(0, 25))}${names.length > 25 ? '...' : ''}</span></td>
        <td>${qty}</td>
        <td><strong>KES ${Number(order.total || 0).toLocaleString()}</strong></td>
        <td>${esc(order.franchiseName || 'Direct')}</td>
        <td><span class="status-badge ${getStatusClass(status)}">${status}</span></td>
        <td><div class="action-btns">${actions}</div></td>
      </tr>
    `;
  }).join('');

  updateBulkBar();
}

/* ═══ SELECTION ═══ */
window.toggleRow = function(checkbox) {
  const id = checkbox.getAttribute('data-id');
  if (checkbox.checked) selectedIds.add(id); else selectedIds.delete(id);
  const tr = checkbox.closest('tr');
  if (tr) tr.classList.toggle('row-selected', checkbox.checked);
  updateBulkBar();
};
window.toggleSelectAll = function(checkbox) {
  document.querySelectorAll('.row-check[data-id]').forEach(cb => {
    cb.checked = checkbox.checked;
    const id = cb.getAttribute('data-id');
    if (checkbox.checked) selectedIds.add(id); else selectedIds.delete(id);
    cb.closest('tr').classList.toggle('row-selected', checkbox.checked);
  });
  updateBulkBar();
};
window.clearSelection = function() {
  selectedIds.clear();
  document.querySelectorAll('.row-check[data-id]').forEach(cb => {
    cb.checked = false;
    cb.closest('tr').classList.remove('row-selected');
  });
  const sa = document.getElementById('selectAll');
  if (sa) sa.checked = false;
  updateBulkBar();
};
function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const info = document.getElementById('bulkInfo');
  if (selectedIds.size > 0) {
    bar.classList.add('active');
    info.textContent = selectedIds.size + ' selected';
  } else {
    bar.classList.remove('active');
  }
}

/* ═══ EVENT DELEGATION ═══ */
document.getElementById('tableBody').addEventListener('click', e => {
  const btn = e.target.closest('.action-btn');
  if (!btn) return;
  const action = btn.getAttribute('data-action');
  const orderId = btn.getAttribute('data-id');
  if (!orderId) return;
  if (action === 'view') viewOrder(orderId);
  else if (action === 'advance') advanceOrder(orderId);
  else if (action === 'cancel') cancelOrder(orderId);
});

/* ═══ ADVANCE ORDER ═══ */
function advanceOrder(orderId) {
  const order = allOrders[orderId];
  if (!order) return showToast('Order not found', 'error');
  const status = order.status || 'new';
  const next = NEXT_ACTION[status];
  if (!next) return showToast('Order is already ' + status, 'info');

  if (next.status === 'shipped') openShipModal(orderId, order);
  else if (next.status === 'delivered') openDeliverModal(orderId, order);
  else {
    if (!confirm('Move order #' + String(orderId).slice(-6) + ' to "' + next.label + '"?')) return;
    applyStatus(orderId, next.status, {});
  }
}

/* ═══ SHIP MODAL ═══ */
function openShipModal(orderId, order) {
  document.getElementById('modalContent').innerHTML = `
    <h3><i class="fas fa-truck"></i> Ship Order #${String(orderId).slice(-6)}</h3>
    <div class="form-group"><label>Driver Name <span class="req">*</span></label><input id="shipDriver" placeholder="e.g. Mosese Mugs"></div>
    <div class="form-row">
      <div class="form-group"><label>Driver Phone <span class="req">*</span></label><input id="shipPhone" placeholder="+254 700 000000"></div>
      <div class="form-group"><label>Vehicle</label><select id="shipVehicle"><option>Motorcycle</option><option>Car</option><option>Van</option><option>Truck</option></select></div>
    </div>
    <div class="form-group"><label>Delivery Fee (KES)</label><input id="shipFee" type="number" value="${order.deliveryFee || 0}"></div>
    <div class="form-group"><label>Notes (optional)</label><textarea id="shipNotes" rows="2"></textarea></div>
    <div class="btn-row">
      <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1;" onclick="confirmShip('${orderId}')"><i class="fas fa-truck"></i> Mark Shipped</button>
    </div>
  `;
  document.getElementById('modal').classList.add('show');
}
window.confirmShip = function(orderId) {
  const driver = document.getElementById('shipDriver').value.trim();
  const phone = document.getElementById('shipPhone').value.trim();
  if (!driver) return showToast('Driver name is required', 'error');
  if (!phone) return showToast('Driver phone is required', 'error');
  applyStatus(orderId, 'shipped', {
    driverName: driver,
    driverPhone: phone,
    driverVehicle: document.getElementById('shipVehicle').value,
    deliveryFee: Number(document.getElementById('shipFee').value) || 0,
    shipNotes: document.getElementById('shipNotes').value.trim(),
    shippedAt: firebase.database.ServerValue.TIMESTAMP
  });
};

/* ═══ DELIVER MODAL ═══ */
function openDeliverModal(orderId, order) {
  document.getElementById('modalContent').innerHTML = `
    <h3><i class="fas fa-check-double"></i> Deliver Order #${String(orderId).slice(-6)}</h3>
    <div class="form-group"><label>Receiver Name <span class="req">*</span></label><input id="delReceiver" placeholder="Who received the package?"></div>
    <div class="form-group"><label>Notes</label><textarea id="delNotes" rows="3"></textarea></div>
    <div class="form-group"><label>Payment</label><select id="delPaid">
      <option value="cod">Cash on Delivery (collected)</option>
      <option value="mpesa">M-Pesa (confirmed)</option>
      <option value="paid">Already paid</option>
      <option value="unpaid">Not paid</option>
    </select></div>
    <div class="btn-row">
      <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1;" onclick="confirmDeliver('${orderId}')"><i class="fas fa-check-double"></i> Confirm Delivery</button>
    </div>
  `;
  document.getElementById('modal').classList.add('show');
}
window.confirmDeliver = function(orderId) {
  const receiver = document.getElementById('delReceiver').value.trim();
  if (!receiver) return showToast('Receiver name is required', 'error');
  applyStatus(orderId, 'delivered', {
    deliveryProof: {
      receiverName: receiver,
      notes: document.getElementById('delNotes').value.trim(),
      paymentStatus: document.getElementById('delPaid').value,
      deliveredBy: currentUser ? (currentUser.email || currentUser.uid) : 'staff'
    },
    deliveredAt: firebase.database.ServerValue.TIMESTAMP
  });
};

/* ═══ CANCEL ORDER (restocks) ═══ */
function cancelOrder(orderId) {
  const reason = prompt('Reason for cancelling order #' + String(orderId).slice(-6) + ':');
  if (reason === null) return;
  applyStatus(orderId, 'cancelled', { cancellationReason: reason || 'No reason provided' });
}

/* ═══ APPLY STATUS (handles restock on cancel) ═══ */
async function applyStatus(orderId, newStatus, extraData) {
  const order = allOrders[orderId];
  if (!order) return showToast('Order not found', 'error');

  const prevStatus = order.status || 'new';
  const wasDecremented = prevStatus !== 'cancelled';
  const isNowCancelled = newStatus === 'cancelled';

  // ── CANCEL: restock everything ──
  if (isNowCancelled && wasDecremented) {
    try {
      const restockUpdates = buildRestockUpdates(order.products || []);
      const now = firebase.database.ServerValue.TIMESTAMP;
      restockUpdates['dsog_fashion_orders/' + orderId + '/status'] = newStatus;
      restockUpdates['dsog_fashion_orders/' + orderId + '/updatedAt'] = now;
      restockUpdates['dsog_fashion_orders/' + orderId + '/updatedBy'] = currentUser ? (currentUser.email || currentUser.uid) : 'staff';

      for (const [k, v] of Object.entries(extraData || {})) {
        restockUpdates['dsog_fashion_orders/' + orderId + '/' + k] = v;
      }

      await database.ref().update(restockUpdates);
      showToast('Order cancelled · stock restored');
      selectedIds.delete(orderId);
      updateBulkBar();
      closeModal();
      return;
    } catch (e) {
      console.error(e);
      showToast('Cancel failed: ' + e.message, 'error');
      return;
    }
  }

  // ── Normal status update ──
  const data = Object.assign({
    status: newStatus,
    updatedAt: firebase.database.ServerValue.TIMESTAMP,
    updatedBy: currentUser ? (currentUser.email || currentUser.uid) : 'staff'
  }, extraData || {});

  try {
    await database.ref('dsog_fashion_orders/' + orderId).update(data);
    showToast('Order moved to "' + STATUS_LABELS[newStatus] + '"');
    selectedIds.delete(orderId);
    updateBulkBar();
    closeModal();
  } catch (e) {
    console.error(e);
    showToast('Failed: ' + e.message, 'error');
  }
}

/* ═══ BULK UPDATE (restocks if cancelling) ═══ */
window.bulkUpdate = async function(newStatus) {
  const ids = Array.from(selectedIds);
  if (!ids.length) return showToast('No orders selected', 'info');
  if (newStatus === 'shipped' || newStatus === 'delivered') {
    return showToast('Ship/Deliver must be done individually', 'error');
  }
  if (!confirm('Update ' + ids.length + ' order(s) to "' + STATUS_LABELS[newStatus] + '"?')) return;

  const now = firebase.database.ServerValue.TIMESTAMP;
  const updates = {};
  const isCancel = newStatus === 'cancelled';

  try {
    for (const id of ids) {
      const order = allOrders[id];
      if (!order) continue;
      const prevStatus = order.status || 'new';

      updates['dsog_fashion_orders/' + id + '/status'] = newStatus;
      updates['dsog_fashion_orders/' + id + '/updatedAt'] = now;
      updates['dsog_fashion_orders/' + id + '/updatedBy'] = currentUser ? (currentUser.email || currentUser.uid) : 'staff';

      // Restock if cancelling a previously-active order
      if (isCancel && prevStatus !== 'cancelled') {
        const restock = buildRestockUpdates(order.products || []);
        Object.assign(updates, restock);
      }
    }

    await database.ref().update(updates);
    showToast(ids.length + ' orders moved to "' + STATUS_LABELS[newStatus] + '"' + (isCancel ? ' · stock restored' : ''));
    clearSelection();
  } catch (e) {
    console.error(e);
    showToast('Failed: ' + e.message, 'error');
  }
};

/* ═══ VIEW ORDER ═══ */
window.viewOrder = function(orderId) {
  const order = allOrders[orderId];
  if (!order) return showToast('Order not found', 'error');

  const products = order.products || [];
  const status = order.status || 'new';

  const flowSteps = STATUS_FLOW.map(s => {
    const cls = 'step' + (status === s ? ' current' : STATUS_FLOW.indexOf(s) < STATUS_FLOW.indexOf(status) ? ' done' : '');
    return `<span class="${cls}">${STATUS_LABELS[s]}</span>`;
  }).join('<i class="fas fa-chevron-right"></i>');

  let html = `<h3><i class="fas fa-info-circle"></i> Order #${String(orderId).slice(-6)}</h3>`;
  html += `<div class="status-flow">${flowSteps}</div>`;
  html += `<div class="detail-grid">`;
  html += `<div class="detail-item"><strong>Customer</strong>${esc(order.customerName || 'N/A')}</div>`;
  html += `<div class="detail-item"><strong>Phone</strong>${esc(order.customerPhone || order.phone || 'N/A')}</div>`;
  html += `<div class="detail-item"><strong>Location</strong>${esc(order.location || 'N/A')}</div>`;
  html += `<div class="detail-item"><strong>Franchise</strong>${esc(order.franchiseName || 'Direct')}</div>`;
  html += `<div class="detail-item"><strong>Subtotal</strong>KES ${Number(order.subtotal || 0).toLocaleString()}</div>`;
  html += `<div class="detail-item"><strong>Delivery</strong>KES ${Number(order.deliveryFee || 0).toLocaleString()}</div>`;
  html += `<div class="detail-item"><strong>Total</strong>KES ${Number(order.total || 0).toLocaleString()}</div>`;
  html += `<div class="detail-item"><strong>Created</strong>${fmtTime(order.createdAt)}</div>`;
  html += `</div>`;

  if (order.driverName) {
    html += `<p style="font-weight:700;font-size:0.75rem;margin:0.8rem 0 0.5rem;color:var(--pink-dark);"><i class="fas fa-truck"></i> Dispatch</p>`;
    html += `<div class="detail-grid">`;
    html += `<div class="detail-item"><strong>Driver</strong>${esc(order.driverName)}</div>`;
    html += `<div class="detail-item"><strong>Phone</strong>${esc(order.driverPhone || 'N/A')}</div>`;
    html += `<div class="detail-item"><strong>Vehicle</strong>${esc(order.driverVehicle || 'N/A')}</div>`;
    html += `</div>`;
  }

  if (order.deliveryProof) {
    html += `<p style="font-weight:700;font-size:0.75rem;margin:0.8rem 0 0.5rem;color:var(--pink-dark);"><i class="fas fa-check-double"></i> Delivery Proof</p>`;
    html += `<div class="detail-grid">`;
    html += `<div class="detail-item"><strong>Received By</strong>${esc(order.deliveryProof.receiverName || 'N/A')}</div>`;
    html += `<div class="detail-item"><strong>Payment</strong>${esc(order.deliveryProof.paymentStatus || 'N/A')}</div>`;
    html += `</div>`;
  }

  if (order.cancellationReason) {
    html += `<div class="detail-item full" style="margin-top:0.5rem;"><strong>Cancellation Reason</strong>${esc(order.cancellationReason)}</div>`;
  }

  if (products.length) {
    html += `<p style="font-weight:700;font-size:0.75rem;margin:0.8rem 0 0.5rem;color:var(--pink-dark);">Products</p>`;
    products.forEach(p => {
      html += `<div style="background:#fdf2f8;padding:0.5rem;border-radius:8px;margin-bottom:4px;font-size:0.7rem;display:flex;justify-content:space-between;">`;
      html += `<span><strong>${esc(p.name)}</strong> × ${p.quantity}${p.size ? ' (' + esc(p.size) + ')' : ''}</span>`;
      html += `<span>KES ${((p.price||0)*(p.quantity||1)).toLocaleString()}</span>`;
      html += `</div>`;
    });
  }

  const next = NEXT_ACTION[status];
  html += `<div class="btn-row">`;
  html += `<button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Close</button>`;
  if (next) {
    html += `<button class="btn btn-primary" style="flex:1;" onclick="closeModal(); advanceOrder('${orderId}')"><i class="fas fa-${next.icon}"></i> ${next.label}</button>`;
  }
  html += `</div>`;

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('show');
};

window.closeModal = function() { document.getElementById('modal').classList.remove('show'); };

/* ═══ UI WIRING ═══ */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTable();
  });
});
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderTable();
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ═══ LISTENERS ═══ */
database.ref('dsog_fashion_orders').on('value', snap => {
  allOrders = snap.val() || {};
  updateStats();
  renderTable();
});
database.ref('dsog_fashion_products').on('value', snap => {
  allProducts = snap.val() || {};
});
database.ref('dsog_fashion_inventory').on('value', snap => {
  allInventory = snap.val() || {};
});

/* ═══ AUTH ═══ */
auth.onAuthStateChanged(user => {
  if (!user) { window.location.href = '/'; return; }
  currentUser = user;
});
</script>
</body>
</html>
