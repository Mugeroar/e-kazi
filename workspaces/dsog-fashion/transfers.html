<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Requisitions | DSOG Fashion</title>
  
  <meta name="theme-color" content="#ec4899">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview(1).png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --pink: #ec4899;
      --pink-dark: #be185d;
      --text-primary: #1e293b;
      --text-muted: #64748b;
      --green: #10b981;
      --red: #ef4444;
      --orange: #f59e0b;
      --blue: #3b82f6;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(145deg, #fdf2f8 0%, #ffffff 100%);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      padding: 0.5rem 2%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(236, 72, 153, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }

    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-img { height: 34px; width: 34px; border-radius: 10px; object-fit: contain; background: white; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2); }
    .logo-text {
      font-weight: 800; font-size: 1.1rem;
      background: linear-gradient(145deg, #f472b6, #be185d);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-text span { font-weight: 600; font-size: 0.7rem; background: #ec4899; -webkit-text-fill-color: #ec4899; margin-left: 3px; }

    .nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-btn {
      background: rgba(236, 72, 153, 0.08);
      border: 1px solid rgba(236, 72, 153, 0.2);
      padding: 0.4rem 0.8rem;
      border-radius: 25px;
      color: var(--pink-dark);
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: var(--pink); color: white; }

    .container { padding: 1rem 2%; max-width: 1400px; margin: 0 auto; }

    .page-header { margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; }
    .page-header h1 { font-size: 1.3rem; font-weight: 800; color: #0f172a; }
    .page-header h1 i { color: var(--pink-dark); margin-right: 6px; }
    .page-header p { color: var(--text-muted); font-size: 0.75rem; }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      align-items: center;
      background: white;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      border: 1px solid #fbcfe8;
    }
    .filter-bar input, .filter-bar select {
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      font-size: 0.7rem;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
    }
    .filter-bar .filter-label {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .requisition-card {
      background: white;
      border-radius: 14px;
      padding: 1rem 1.2rem;
      border: 1px solid #fbcfe8;
      box-shadow: 0 3px 12px rgba(190,24,93,0.03);
      transition: all 0.2s;
    }
    .requisition-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(190,24,93,0.08);
    }
    .requisition-card.pending { border-left: 4px solid var(--orange); }
    .requisition-card.approved { border-left: 4px solid var(--green); }
    .requisition-card.rejected { border-left: 4px solid var(--red); }
    .requisition-card.completed { border-left: 4px solid var(--blue); }

    .req-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 0.5rem;
    }
    .req-header .ref {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--pink-dark);
    }
    .req-header .date {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .status-badge {
      padding: 0.15rem 0.6rem;
      border-radius: 12px;
      font-size: 0.6rem;
      font-weight: 700;
    }
    .status-badge.pending { background: #fef3c7; color: #92400e; }
    .status-badge.approved { background: #dbeafe; color: #1e40af; }
    .status-badge.rejected { background: #fee2e2; color: #991b1b; }
    .status-badge.completed { background: #d1fae5; color: #065f46; }

    .req-route {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .req-route .from { font-weight: 600; }
    .req-route .arrow { color: var(--pink); }
    .req-route .to { font-weight: 600; }

    .req-products {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 0.5rem;
    }
    .product-tag {
      background: #fdf2f8;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-size: 0.6rem;
      color: var(--text-muted);
      border: 1px solid #fbcfe8;
    }
    .product-tag .qty { font-weight: 700; color: var(--pink-dark); }

    .req-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #fdf2f8;
    }
    .btn-sm {
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.65rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-approve { background: #d1fae5; color: #065f46; }
    .btn-approve:hover { background: #10b981; color: white; }
    .btn-reject { background: #fee2e2; color: #991b1b; }
    .btn-reject:hover { background: #ef4444; color: white; }
    .btn-complete { background: #dbeafe; color: #1e40af; }
    .btn-complete:hover { background: #3b82f6; color: white; }
    .btn-view { background: #f1f5f9; color: #475569; }
    .btn-view:hover { background: #64748b; color: white; }

    .req-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.6rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      flex-wrap: wrap;
      gap: 4px;
    }
    .req-footer .by { display: flex; align-items: center; gap: 4px; }
    .req-footer .notes { font-style: italic; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
      grid-column: 1 / -1;
    }
    .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 0.8rem; color: #fbcfe8; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 1rem;
    }
    .stat-mini {
      background: white;
      border-radius: 12px;
      padding: 0.6rem 1rem;
      text-align: center;
      border: 1px solid #fbcfe8;
    }
    .stat-mini .stat-num { font-size: 1.2rem; font-weight: 800; color: var(--pink-dark); }
    .stat-mini .stat-label { font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 3000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 20px;
      padding: 1.5rem;
      max-width: 500px;
      width: 95%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }
    .modal h3 { font-size: 0.95rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; color: var(--pink-dark); }
    .modal .form-group { margin-bottom: 0.6rem; }
    .modal .form-group label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 0.15rem;
    }
    .modal .form-group input, .modal .form-group textarea {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
    }
    .btn-row { display: flex; gap: 8px; margin-top: 1rem; justify-content: flex-end; }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover { background: #dc2626; }

    .toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--green);
      color: white;
      padding: 0.7rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      z-index: 4000;
      animation: slideIn 0.3s ease;
      box-shadow: 0 8px 20px rgba(16,185,129,0.25);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
    }
    .toast.error { background: var(--red); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .container { padding: 0.8rem; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .req-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview(1).png" alt="DSOG Fashion" class="logo-img">
      <span class="logo-text">DSOG <span>Fashion</span></span>
    </a>
    <div class="nav-right">
      <a href="index.html" class="nav-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
      <a href="dsog-fashion-orders.html" class="nav-btn"><i class="fas fa-shopping-bag"></i> Orders</a>
      <a href="dsog-fashion-inventory.html" class="nav-btn"><i class="fas fa-boxes"></i> Inventory</a>
      <a href="dsog-fashion-products.html" class="nav-btn"><i class="fas fa-tags"></i> Products</a>
      <a href="dsog-fashion-franchisees.html" class="nav-btn"><i class="fas fa-store"></i> Franchises</a>
      <a href="stock-transfer.html" class="nav-btn" style="background:var(--pink);color:white;border-color:var(--pink-dark);"><i class="fas fa-plus"></i> New Requisition</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-file-invoice"></i> Requisitions</h1>
        <p>View, approve, reject, or complete stock requisitions</p>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-mini"><div class="stat-num" id="statPending">0</div><div class="stat-label">Pending</div></div>
      <div class="stat-mini"><div class="stat-num" id="statApproved">0</div><div class="stat-label">Approved</div></div>
      <div class="stat-mini"><div class="stat-num" id="statRejected">0</div><div class="stat-label">Rejected</div></div>
      <div class="stat-mini"><div class="stat-num" id="statCompleted">0</div><div class="stat-label">Completed</div></div>
    </div>

    <div class="filter-bar">
      <span class="filter-label"><i class="fas fa-filter"></i> Filter</span>
      <input type="text" id="searchInput" placeholder="Search by ref, store, or product..." style="flex:1;min-width:150px;">
      <select id="filterStatus">
        <option value="all">All Status</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="completed">Completed</option>
      </select>
      <button class="nav-btn" onclick="clearFilters()" style="background:#f1f5f9;color:#475569;border-color:#e2e8f0;">Clear</button>
    </div>

    <div class="cards-grid" id="requisitionGrid">
      <div class="empty-state"><i class="fas fa-file-invoice"></i>No requisitions found</div>
    </div>
  </div>

  <!-- Reject Modal -->
  <div class="modal-overlay" id="rejectModal">
    <div class="modal">
      <h3><i class="fas fa-times-circle" style="color:var(--red);"></i> Reject Requisition</h3>
      <div class="form-group">
        <label>Rejection Reason *</label>
        <textarea id="rejectReason" rows="3" placeholder="Why is this requisition being rejected?"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeRejectModal()">Cancel</button>
        <button class="btn btn-danger" id="confirmRejectBtn" onclick="confirmReject()">Reject</button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7kppUyHUaPzeLBV62NEZWuHiuz1Kz0mA",
      authDomain: "mugera-e51cc.firebaseapp.com",
      databaseURL: "https://mugera-e51cc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mugera-e51cc",
      storageBucket: "mugera-e51cc.firebasestorage.app",
      messagingSenderId: "1024868637509",
      appId: "1:1024868637509:web:321faecddce8f11d9cfc2c"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    let allRequisitions = {};
    let allFranchisees = {};
    let allProducts = {};
    let currentRejectId = null;

    function showToast(msg, isError = false) {
      const container = document.getElementById('toastContainer');
      const existing = container.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : ''}`;
      toast.innerHTML = `<i class="fas fa-${isError ? 'exclamation-circle' : 'check-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    function getLocationName(locationId) {
      if (locationId === 'main_shop') return 'Main Shop';
      return allFranchisees[locationId]?.businessName || locationId;
    }

    function formatDate(timestamp) {
      if (!timestamp) return 'N/A';
      const date = typeof timestamp === 'number' ? new Date(timestamp) : new Date(timestamp);
      if (isNaN(date.getTime())) return 'N/A';
      return date.toLocaleDateString('en-KE', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function getStatusBadge(status) {
      const s = status || 'pending';
      return `<span class="status-badge ${s}">${s.toUpperCase()}</span>`;
    }

    // Load franchisees
    database.ref('dsog_fashion_franchisees').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        allFranchisees = data;
      } else {
        allFranchisees = {};
      }
      renderRequisitions();
    });

    // Load products
    database.ref('dsog_fashion_products').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        allProducts = data;
        Object.entries(allProducts).forEach(([id, p]) => { if (p) p.id = id; });
      } else {
        allProducts = {};
      }
      renderRequisitions();
    });

    // Load requisitions
    database.ref('dsog_fashion_requisitions').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        allRequisitions = data;
      } else {
        allRequisitions = {};
      }
      renderRequisitions();
    });

    function renderRequisitions() {
      const grid = document.getElementById('requisitionGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filterStatus = document.getElementById('filterStatus').value;

      let requisitions = Object.entries(allRequisitions)
        .map(([id, data]) => ({ id, ...data }))
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      // Apply filters
      if (search) {
        requisitions = requisitions.filter(r => 
          (r.reference || '').toLowerCase().includes(search) ||
          (r.fromName || '').toLowerCase().includes(search) ||
          (r.toName || '').toLowerCase().includes(search) ||
          (r.products || []).some(p => (p.name || '').toLowerCase().includes(search))
        );
      }
      if (filterStatus !== 'all') {
        requisitions = requisitions.filter(r => (r.status || 'pending') === filterStatus);
      }

      // Update stats
      const pending = requisitions.filter(r => (r.status || 'pending') === 'pending').length;
      const approved = requisitions.filter(r => r.status === 'approved').length;
      const rejected = requisitions.filter(r => r.status === 'rejected').length;
      const completed = requisitions.filter(r => r.status === 'completed').length;

      document.getElementById('statPending').textContent = pending;
      document.getElementById('statApproved').textContent = approved;
      document.getElementById('statRejected').textContent = rejected;
      document.getElementById('statCompleted').textContent = completed;

      if (requisitions.length === 0) {
        grid.innerHTML = '<div class="empty-state"><i class="fas fa-file-invoice"></i>No requisitions found</div>';
        return;
      }

      grid.innerHTML = requisitions.map(r => {
        const status = r.status || 'pending';
        const products = r.products || [];
        const productTags = products.map(p => 
          `<span class="product-tag">${p.name || 'Unknown'} <span class="qty">×${p.quantity || 0}</span></span>`
        ).join(' ');

        const showActions = status === 'pending' || status === 'approved';

        return `
          <div class="requisition-card ${status}">
            <div class="req-header">
              <span class="ref">📋 ${r.reference || 'Requisition'}</span>
              <span class="date">${formatDate(r.createdAt || r.date)}</span>
              ${getStatusBadge(status)}
            </div>
            <div class="req-route">
              <span class="from">${r.fromName || getLocationName(r.from)}</span>
              <span class="arrow"><i class="fas fa-arrow-right"></i></span>
              <span class="to">${r.toName || getLocationName(r.to)}</span>
              <span style="font-size:0.65rem;color:var(--text-muted);margin-left:auto;">${products.length} product${products.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="req-products">${productTags}</div>
            ${r.notes ? `<div style="font-size:0.65rem;color:var(--text-muted);margin-bottom:0.3rem;">📝 ${r.notes}</div>` : ''}
            ${r.rejectionReason ? `<div style="font-size:0.65rem;color:var(--red);margin-bottom:0.3rem;">❌ Rejected: ${r.rejectionReason}</div>` : ''}
            
            ${showActions ? `
            <div class="req-actions">
              ${status === 'pending' ? `
                <button class="btn-sm btn-approve" onclick="approveRequisition('${r.id}')"><i class="fas fa-check"></i> Approve</button>
                <button class="btn-sm btn-reject" onclick="openRejectModal('${r.id}')"><i class="fas fa-times"></i> Reject</button>
              ` : ''}
              ${status === 'approved' ? `
                <button class="btn-sm btn-complete" onclick="completeRequisition('${r.id}')"><i class="fas fa-check-double"></i> Complete Transfer</button>
              ` : ''}
              <button class="btn-sm btn-view" onclick="viewRequisition('${r.id}')"><i class="fas fa-eye"></i> View</button>
            </div>
            ` : ''}

            <div class="req-footer">
              <span class="by"><i class="fas fa-user"></i> ${r.createdBy || 'staff'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function approveRequisition(reqId) {
      if (!confirm('Approve this requisition?')) return;
      try {
        await database.ref(`dsog_fashion_requisitions/${reqId}`).update({
          status: 'approved',
          approvedAt: firebase.database.ServerValue.TIMESTAMP,
          approvedBy: auth.currentUser?.email || 'staff'
        });
        showToast('✅ Requisition approved! Ready to complete transfer.');
      } catch (e) {
        showToast('❌ Failed to approve: ' + e.message, true);
      }
    }

    function openRejectModal(reqId) {
      currentRejectId = reqId;
      document.getElementById('rejectReason').value = '';
      document.getElementById('rejectModal').classList.add('show');
    }

    function closeRejectModal() {
      document.getElementById('rejectModal').classList.remove('show');
      currentRejectId = null;
    }

    async function confirmReject() {
      const reason = document.getElementById('rejectReason').value.trim();
      if (!reason) {
        showToast('❌ Please provide a rejection reason', true);
        return;
      }
      if (!currentRejectId) return;

      try {
        await database.ref(`dsog_fashion_requisitions/${currentRejectId}`).update({
          status: 'rejected',
          rejectionReason: reason,
          rejectedAt: firebase.database.ServerValue.TIMESTAMP,
          rejectedBy: auth.currentUser?.email || 'staff'
        });
        showToast('✅ Requisition rejected');
        closeRejectModal();
      } catch (e) {
        showToast('❌ Failed to reject: ' + e.message, true);
      }
    }

    async function completeRequisition(reqId) {
      const req = allRequisitions[reqId];
      if (!req) return;

      if (!confirm(`Complete transfer for ${req.reference}? This will update stock.`)) return;

      const confirmBtn = document.getElementById('confirmRejectBtn');
      try {
        const updates = {};
        const fromLocation = req.from;
        const toLocation = req.to;

        for (const p of req.products) {
          const product = allProducts[p.productId];
          if (!product) {
            showToast(`⚠️ Product ${p.name} not found, skipping...`, true);
            continue;
          }

          const existingLocations = product.locations || {};
          const newLocations = { ...existingLocations };

          // Deduct from source
          const fromStock = existingLocations[fromLocation] || 0;
          newLocations[fromLocation] = Math.max(0, fromStock - p.quantity);

          // Add to destination
          const toStock = existingLocations[toLocation] || 0;
          newLocations[toLocation] = toStock + p.quantity;

          const newTotal = Object.values(newLocations).reduce((sum, val) => sum + (val || 0), 0);

          updates[`dsog_fashion_products/${p.productId}/locations`] = newLocations;
          updates[`dsog_fashion_products/${p.productId}/stock`] = newTotal;
          updates[`dsog_fashion_products/${p.productId}/quantity`] = newTotal;
          updates[`dsog_fashion_products/${p.productId}/updatedAt`] = firebase.database.ServerValue.TIMESTAMP;
        }

        // Mark requisition as completed
        updates[`dsog_fashion_requisitions/${reqId}/status`] = 'completed';
        updates[`dsog_fashion_requisitions/${reqId}/completedAt`] = firebase.database.ServerValue.TIMESTAMP;
        updates[`dsog_fashion_requisitions/${reqId}/completedBy`] = auth.currentUser?.email || 'staff';

        await database.ref().update(updates);
        showToast('✅ Transfer completed! Stock updated.');
      } catch (e) {
        showToast('❌ Failed to complete: ' + e.message, true);
      }
    }

    function viewRequisition(reqId) {
      const req = allRequisitions[reqId];
      if (!req) return;
      
      const products = (req.products || []).map(p => `${p.name} ×${p.quantity}`).join('\n');
      alert(`📋 ${req.reference || 'Requisition'}\n\n` +
        `From: ${req.fromName || getLocationName(req.from)}\n` +
        `To: ${req.toName || getLocationName(req.to)}\n` +
        `Status: ${req.status || 'pending'}\n` +
        `Date: ${formatDate(req.createdAt || req.date)}\n` +
        `Products:\n${products}\n` +
        `Notes: ${req.notes || 'None'}\n` +
        `Created by: ${req.createdBy || 'staff'}`);
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterStatus').value = 'all';
      renderRequisitions();
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', renderRequisitions);
    document.getElementById('filterStatus').addEventListener('change', renderRequisitions);

    // Modal close on outside click
    document.getElementById('rejectModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('rejectModal')) closeRejectModal();
    });

    auth.onAuthStateChanged((user) => {
      if (!user) window.location.href = '/';
    });

    // Expose functions
    window.approveRequisition = approveRequisition;
    window.openRejectModal = openRejectModal;
    window.closeRejectModal = closeRejectModal;
    window.confirmReject = confirmReject;
    window.completeRequisition = completeRequisition;
    window.viewRequisition = viewRequisition;
    window.clearFilters = clearFilters;
    window.renderRequisitions = renderRequisitions;
  </script>
</body>
</html>
