<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Customers | BrandInn Prints</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview(1).png">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body>
  <script type="importmap">
    {"imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
    }}
  </script>

  <script type="module">
    import {
      mountPageShell, bootstrapListPage, createViaModal, openDrawer,
      updateRecord, deleteRecord, esc, initials
    } from "./_print-shared.js";

    const NODE = "brandinn_print_customers";

    mountPageShell({
      title: "Customers",
      subtitle: "Client directory — phone, email, and order history",
      icon: "fa-user-group",
      createLabel: "New Customer",
      searchPlaceholder: "Search by name, phone, or email..."
    });

    const FIELDS = [
      { key: "name", label: "Full name", required: true, placeholder: "e.g. Moses Mugera" },
      { key: "businessName", label: "Business name", placeholder: "If applicable" },
      { key: "phone", label: "Phone", type: "tel", placeholder: "+254 7XX XXX XXX" },
      { key: "email", label: "Email", type: "email", placeholder: "name@example.com" },
      { key: "address", label: "Address", placeholder: "Street, area, city" },
      {
        key: "customerType", label: "Type", type: "select", defaultValue: "individual",
        options: ["individual", "business", "government", "ngo", "other"]
      },
      { key: "notes", label: "Notes", type: "textarea", rows: 2, placeholder: "Preferences, history, etc." }
    ];

    bootstrapListPage({
      node: NODE,
      containerId: "listContainer",
      searchFields: ["name", "phone", "email", "businessName"],
      statusOptions: [],
      emptyMessage: "No customers yet",
      emptyIcon: "fa-user-group",
      emptyCta: "Add your first customer",

      onCreate: () => createViaModal(NODE, {
        title: "New Customer",
        subtitle: "Add a customer to your directory",
        submitLabel: "Add customer",
        fields: FIELDS
      }),

      renderCard: (c) => {
        const name = c.name || "Customer";
        const ordersCount = c.ordersCount ?? c.totalOrders ?? 0;
        return `
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:0.6rem;">
            <div style="width:42px;height:42px;background:#ecfdf5;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:#10b981;flex-shrink:0;">
              ${initials(name)}
            </div>
            <div style="min-width:0;">
              <h3 style="margin:0;">${esc(name)}</h3>
              ${c.businessName ? `<div style="font-size:0.72rem;color:#94a3b8;">${esc(c.businessName)}</div>` : ""}
            </div>
          </div>
          <div class="meta">${esc(c.phone || "No phone")} · ${esc(c.email || "No email")}</div>
          <div class="row">
            <span class="status-tag status-active">${ordersCount} ${ordersCount === 1 ? "order" : "orders"}</span>
            ${c.customerType && c.customerType !== "individual" ? `<span style="font-size:0.7rem;color:#64748b;text-transform:capitalize;">${esc(c.customerType)}</span>` : ""}
          </div>
        `;
      },

      onCardClick: async (item, id) => {
        await openDrawer({
          title: item.name || "Customer",
          subtitle: item.businessName || "",
          fields: FIELDS,
          initialValues: item,
          onSave: async (values) => {
            await updateRecord(NODE, id, values);
          },
          onDelete: async () => {
            await deleteRecord(NODE, id);
          }
        });
      }
    });
  </script>
</body>
</html>
