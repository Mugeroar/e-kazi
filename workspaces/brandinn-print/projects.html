<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Projects | BrandInn Prints</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview(1).png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body>
  <script type="importmap">
    {"imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
    }}
  </script>

  <script type="module">
    import {
      mountPageShell, bootstrapListPage, createViaModal, openDrawer,
      updateRecord, deleteRecord, esc, statusClass, formatDate
    } from "./_print-shared.js";

    const NODE = "brandinn_print_projects";

    mountPageShell({
      title: "Projects",
      subtitle: "Print projects — banners, stickers, receipts, business cards, and more",
      icon: "fa-project-diagram",
      createLabel: "New Project",
      searchPlaceholder: "Search projects or clients..."
    });

    const FIELDS = [
      { key: "projectName", label: "Project name", required: true, placeholder: "e.g. Business Banner" },
      { key: "businessName", label: "Client / business", placeholder: "e.g. Lake Victoria Crafts" },
      {
        key: "serviceType", label: "Service type", type: "select",
        options: ["Print Design", "Brand Identity", "Logo Design", "Signage", "Other"]
      },
      { key: "startDate", label: "Start date", type: "date" },
      { key: "targetDate", label: "Target date", type: "date" },
      {
        key: "status", label: "Status", type: "select", defaultValue: "planning",
        options: ["planning", "in-progress", "completed", "on-hold"]
      },
      { key: "description", label: "Description", type: "textarea", rows: 3, placeholder: "Project details..." },
      { key: "internalNotes", label: "Internal notes", type: "textarea", rows: 2, placeholder: "Only visible to staff" }
    ];

    bootstrapListPage({
      node: NODE,
      containerId: "listContainer",
      searchFields: ["projectName", "businessName"],
      statusOptions: ["planning", "in-progress", "completed", "on-hold"],
      emptyMessage: "No projects yet",
      emptyIcon: "fa-project-diagram",
      emptyCta: "Create your first project",

      onCreate: () => createViaModal(NODE, {
        title: "New Project",
        subtitle: "Create a new print project",
        submitLabel: "Create project",
        fields: FIELDS
      }),

      renderCard: (p) => `
        <h3>${esc(p.projectName || p.name || "Untitled")}</h3>
        <div class="meta">${esc(p.businessName || "Client")} · ${esc(p.serviceType || "Print")}</div>
        <div class="row">
          <span class="status-tag ${statusClass(p.status)}">${esc(p.status || "planning")}</span>
          <span style="font-size:0.7rem;color:#64748b;">${p.startDate ? "Start " + esc(p.startDate) : ""}</span>
        </div>
      `,

      onCardClick: async (item, id) => {
        const result = await openDrawer({
          title: item.projectName || "Project",
          subtitle: item.businessName || "",
          fields: FIELDS,
          initialValues: item,
          onSave: async (values) => {
            await updateRecord(NODE, id, values);
          },
          onDelete: async () => {
            await deleteRecord(NODE, id);
          }
        });
        if (result === "deleted") {
          // Real-time listener will auto-refresh
        }
      }
    });
  </script>
</body>
</html>
